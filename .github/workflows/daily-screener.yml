name: Daily Stock Screener

on:
  # 로컬 crontab 에서 스케줄 실행 (GitHub Actions cron 은 5시간+ 지연 이슈로 비활성)
  # schedule:
  #   - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: '검사할 상위 종목 수'
        required: false
        default: '100'

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write  # data/signals.db 자동 커밋용

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock screener
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE: ${{ secrets.KIS_ACCOUNT_PROD_CODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SCREEN_LIMIT: ${{ github.event.inputs.limit || '100' }}
          OUTPUT_FILE: stock_signals.json
          TZ: Asia/Seoul
        run: python stock_screener.py

      - name: Upload signals artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-signals-${{ github.run_id }}
          path: stock_signals.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit signal DB
        if: success()
        run: |
          if [ ! -f data/signals.db ]; then
            echo "DB 파일 없음, 커밋 스킵"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.db
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 스킵"
            exit 0
          fi
          git commit -m "chore(data): 신호 이력 업데이트 (run ${{ github.run_id }})"
          # 다른 워크플로우와 push 충돌 대비 pull --rebase
          git pull --rebase origin main
          git push
